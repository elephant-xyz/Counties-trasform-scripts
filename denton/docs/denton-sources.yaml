verified_at: "2026-11-25 09:11 PST"
required_history_boundary: "all years each source exposes; permits pilot = City of Denton 2020-2026 bulk"
mode: "local (Restate 1.7.2 + Postgres 16, docker compose project oracle-tx-denton on 127.0.0.1:5433/8081/9071); no AWS"
parcel:
  canonical_source: "tax_roll"
  assessed_parcel_count: 379902
  assessed_count_source: "DCAD 2026 certified Prodigy JSON export (Denton-protaxExport-20260727.json): 379,902 propType=R accounts, 0 inactive, 0 roll-correction rows, 0 duplicate pIDs; also 24,303 P, 6,381 MH, 71,400 MN accounts (not real property, out of scope)"
  roll_year: "2026"
  roll_status: "certified (export dated 2026-07-27)"
  gis_feature_count: 385908
  gis_source: "https://gis.dentoncounty.gov/arcgis/rest/services/Parcels_FC/MapServer/0 (returnCountOnly 2026-11-25)"
  discrepancy_threshold_pct: 2.0
  discrepancy_explanation: "GIS polygons (385,908) exceed certified real accounts (379,902) by 6,006 (1.58%): GIS carries geometry for accounts created after certification and non-account polygons (ROW/common areas); DCAD nightly 2027 preliminary roll has 383,182 distinct pIDs. Below threshold; seed is the certified roll, not GIS."
  separately_assessed_without_geometry: "acknowledged"
  seed_decision: "seed = every certified 2026 real account (pID) from the DCAD certified JSON export; accounts with no situs street name are excluded at transform as no_situs_street and kept as tombstoned dead rows"
  identifier_name: "DCAD property ID (pID); geoID is the map/legal reference"
  identifier_format: "integer string, no padding; geoID like SL0100A-00000A-0000-0004-0000"
  join_keys: "pID == City of Denton permit SITE_APN; pID == nightly CSV pid"
  identifier_proven: true
  identifier_proof: "pID 8 resolves in certified JSON, nightly CSV (property_url https://denton.prodigycad.com/property-detail/<pid>), and Denton permit SITE_APN values join exactly"
appraisal:
  url: "https://dentoncad.net/data/_uploaded/files/datafiles/2026/CertifiedDataJSON/2026%20CERTIFIED%20DATA%20-%20JSON.zip"
  mode: "official bulk download (anonymous, no CAPTCHA); 2,458,367,178-byte ZIP of one 21.2 GB JSON array"
  artifact_sha256: "344a152bd93e2caf59a2fbc5ced4571c73b1af1a327d971a002a170f42aa2026"
  probe: "full download 2026-11-25 ~6 min at ~7 MB/s; streamed extract ~4 min"
  safe_concurrency: 1
  full_run_estimate: "bulk: < 1 h transform + validate for 379,902 accounts"
  per_parcel_portal: "https://denton.prodigycad.com/property-detail/<pID> (True Prodigy SPA; not scraped)"
corporate_registry:
  source: "Texas Comptroller Active Franchise Taxpayers (data.texas.gov 9cir-efmm; 3,553,590 rows; updated 2026-11-25) + per-entity GET https://comptroller.texas.gov/data-search/franchise-tax/<taxpayerId>"
  status: "probed; bulk snapshot loadable; Texas SOS SOSDirect is paid/login and not used"
  note: "No Texas equivalent of Sunbiz document detail is wired into the lexicon company class (sunbiz_document_number only)"
licensing:
  source: "TDLR All Licenses (data.texas.gov 7358-krk7; 976,150 rows; updated 2026-11-13): electrical and A/C contractors; Texas has no general-contractor license; plumbers are TSBPE (not wired)"
  status: "probed; City of Denton permits carry no license number, so no license lookups are keyed"
  lexicon_gap: "live manifest has no license class, no contractor_has_license edge; contractor_has_person exists"
places:
  source: "Overture Maps places"
  status: "not run (skill implemented for Lee only; no duckdb on host)"
destination:
  writes_in_scope: true
  proven: true
  project: "local docker compose project oracle-tx-denton (job-scoped, separate from oracle-ca-los-angeles)"
  environment: "non-production (local, 127.0.0.1:5433 only)"
